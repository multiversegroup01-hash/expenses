<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0A09">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مصاريف">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>مصاريف مالتيفرس</title>
<style>
html,body{height:100%;margin:0;background:#0B0A09;color:#F5F1E8;font-family:"Segoe UI",Tahoma,sans-serif}
#splash{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;text-align:center}
#splash img{width:120px;height:120px;border-radius:24px}
#msg{font-size:15px;color:#C9BFA8;min-height:22px}
#retry{font:inherit;font-size:15px;padding:12px 22px;border-radius:12px;border:1px solid #D08A1E;background:transparent;color:#F0B963;cursor:pointer}
</style>
</head>
<body>
<div id="splash">
  <img src="logo-mark.png" alt="Multiverse Group">
  <div id="msg">جاري التحميل…</div>
  <button id="retry" type="button" hidden>جرّب تاني</button>
</div>
<script>
(function(){
  var U="https://script.google.com/macros/s/AKfycbzYcmQA9lbT2Hz2spqYDyCS0a6jnHF0ErXIGXaGhCq6y5jAyZJf5Whqu5o2oLwvuYisCQ/exec";
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
  function show(html){ document.open(); document.write(html); document.close(); }
  function fail(){
    document.getElementById("msg").textContent="مفيش اتصال بالنت. اتأكد إنك متوصل وجرّب تاني.";
    document.getElementById("retry").hidden=false;
  }
  document.getElementById("retry").onclick=function(){ location.reload(); };
  var cached=null; try{ cached=localStorage.getItem("mv-ui"); }catch(e){}
  var done=false;
  var timer=setTimeout(function(){ if(!done && cached){ done=true; show(cached); } },7000);
  fetch(U+"?ui=1&t="+Date.now()).then(function(r){ if(!r.ok) throw 0; return r.text(); }).then(function(h){
    if(h.indexOf("<html")<0) throw 0;
    try{ localStorage.setItem("mv-ui",h); }catch(e){}
    if(!done){ done=true; clearTimeout(timer); show(h); }
  }).catch(function(){
    if(done) return;
    done=true; clearTimeout(timer);
    if(cached) show(cached); else fail();
  });
})();
</script>
</body>
</html>
